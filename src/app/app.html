<mat-toolbar class="gap-2 border-b border-(--mat-sys-outline-variant)">
  <a routerLink="/" class="flex items-center gap-2 pr-4 text-inherit no-underline">
    <mat-icon aria-hidden="true" fontIcon="deployed_code" class="text-(--mat-sys-primary)" />
    <span class="text-lg font-semibold tracking-tight">Tmyts DevOps</span>
  </a>

  <nav class="flex gap-1" aria-label="Main">
    @for (link of links; track link.path) {
    <a [matButton]="rla.isActive ? 'filled' : 'text'" [routerLink]="link.path" routerLinkActive
      #rla="routerLinkActive">{{ link.label }}</a>
    }
  </nav>

  <span class="flex-1"></span>

  <a matIconButton routerLink="/" aria-label="Home">
    <mat-icon fontIcon="home" />
  </a>
  <button matIconButton type="button" aria-label="About">
    <mat-icon fontIcon="info" />
  </button>
</mat-toolbar>
<main class="min-h-0 flex-1">
  <router-outlet />
</main>
