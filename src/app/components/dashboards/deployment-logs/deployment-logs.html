<a mat-button routerLink="/dashboards/deployments" class="-ml-3 mb-2">← Back to deployments</a>
<app-page-header title="Deployment logs" [loading]="connection() === 'connecting'" [subtitle]="namespace() + ' / ' + name()" />

@if (connection() === 'closed' && !noPods()) {
  <div role="alert" class="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-xl bg-(--mat-sys-error-container) px-4 py-3 text-sm text-(--mat-sys-on-error-container)">
    <span class="font-bold">The log stream was interrupted.</span>
    <button mat-stroked-button type="button" (click)="connect()">Reconnect</button>
  </div>
}

@if (noPods()) {
  <div class="rounded-xl border border-dashed border-(--mat-sys-outline-variant) p-10 text-center text-sm text-(--mat-sys-on-surface-variant)">
    This deployment has no running pods, so there are no logs to stream. It may be scaled down to zero.
  </div>
} @else if (connection() !== 'connecting' || lines().length > 0) {
  <app-log-viewer
    [lines]="lines()"
    [status]="connection() === 'live' ? 'Live · last 200 lines per pod, then new lines as they arrive' : 'Disconnected'"
    emptyMessage="Connected. Waiting for the pods to write something…"
    [filename]="namespace() + '-' + name()"
  />
}
