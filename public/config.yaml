apiUrl: http://localhost:8005/api/
# How often the dashboards poll live data (usage, pod status), in seconds.
refreshIntervalSeconds: 5
# Namespaces pre-selected in the pods and deployments filters (empty list = all).
defaultNamespaces:
  - tmyts
endpoints:
  nodes: "nodes"
  pods: "pods"
  deployments: "deployments"
  jobs: "jobs"
  events: "events"
  nodeUsage: "node-usage"
  deploymentMetrics: "deployment-metrics"
  podMetrics: "pod-metrics"
