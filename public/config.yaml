apiUrl: http://localhost:8005/api/
# How often the dashboards poll live data (usage, pod status), in seconds.
refreshIntervalSeconds: 5
# Namespaces pre-selected in the dashboards' namespace filters (empty list = all).
defaultNamespaces:
  - tmyts
# Show the Scale and Restart buttons on deployment and statefulset cards. The API has no
# authentication, so set false for a read-only dashboard.
actionsEnabled: true
# The GitHub account whose repositories the Projects section runs workflows for.
githubOwner: baosiek
endpoints:
  nodes: "nodes"
  pods: "pods"
  deployments: "deployments"
  jobs: "jobs"
  events: "events"
  nodeUsage: "node-usage"
  deploymentMetrics: "deployment-metrics"
  podMetrics: "pod-metrics"
  jobMetrics: "job-metrics"
  statefulset: "statefulsets"
  statefulsetMetrics: "statefulset-metrics"
  scale: "scale"
  restart: "restart"
  projects: "projects"
  executeProjectActions: "execute-project-actions"
  monitorProjectActions: "monitor-project-actions"
